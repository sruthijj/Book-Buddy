services:
  - type: web
    name: book-buddy-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: "sqlite:///./book_buddy.db"
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
